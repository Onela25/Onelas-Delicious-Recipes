<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>Onela's Recipes</title>
</head>

<body>
    <header>
        <h1>🍲Onela's Food Recipe Generator 🍲</h1>
    </header>
    <div class="container">
        <main>
            <div class="form-container">
                <form id="recipe-generator-form">
                    <input type="text" id="ingredient-input" placeholder="Enter the star ingredient of the recipe"
                        autofocus required autocomplete="off" class="instructions" />
                    <input type="submit" class="submit-button" />
                </form>
                <div class="hint">i.e: Pilchard, Egg or Potato.</div>
            </div>
            <div class="recipe hidden" id="recipe"></div>
        </main>
        <br />
        <footer>
            This AI project was coded by
            <a href="https://github.com/Onela25" target="_blank" rel="noopener noreferrer">Onela Wellem</a>
            with ♥️ and is
            <a href="https://github.com/Onela25/Onela-s-Food-recipe-generator" target="_blank"
                rel="noopener noreferrer">open-sourced on GitHub</a>
            and is hosted on
            <a href="https://oneladeliciousrecipes.netlify.app/" target="_blank" rel="noopener noreferrer">Netlify</a>.
        </footer>
    </div>
    <script src="src/index.js"></script>
</body>

</html>
